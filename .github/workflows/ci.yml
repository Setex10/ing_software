name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage (>= 80%)
        run: npm run test:coverage

      - name: Lint
        run: npx next lint --max-warnings=0

      - name: Build de producción
        run: npm run build

      - name: Build de la imagen Docker
        run: docker build -t ing-software:ci .
